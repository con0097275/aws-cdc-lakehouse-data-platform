document_type: contract
owner: data-governance
domain: ops
classification: internal
description: Dataset registry, lineage graph and DQ rules.
include:
  - "governance/catalog/domains.yml"
  - "governance/lineage/openlineage.yml"
  - "governance/dq/rules.yml"
