# RAG golden set (AI-P4).
#
# EVERY case is grounded in a document that exists in this repository, and every
# `key_facts` string is asserted to appear in that document by
# `spark/tests/test_ai_eval.py::TestDatasetGrounding`. A question whose answer is not in the
# corpus is a question about a fact we do not have, and scoring against it measures nothing.
#
# `paraphrase: true` marks cases deliberately phrased in SYNONYMS rather than repository
# vocabulary. These are the only cases that can show whether dense retrieval earns its cost:
# BM25 is strongest exactly where question and corpus share words, so a set written in house
# jargon flatters it and resolves nothing (ADR-049).
version: 2
dataset_id: rag_golden_v2
cases:

# ---------------------------------------------------- CDC / lakehouse architecture
- {id: arch_01, category: architecture, difficulty: easy, question: "What is FULL_CDC and why is it canonical?", expect_source: docs/L1_FULL_CDC.md, key_facts: ["append-only"]}
